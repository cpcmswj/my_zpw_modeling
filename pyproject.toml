[project]
name = "py_bishe"
version = "1.0.0"
description = "轨道电路故障分析系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "gunicorn==23.0.0",
    "Jinja2==3.1.4",
    "pydantic==2.12.5",
    "python-multipart==0.0.22",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "matplotlib==3.8.4",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "anyio==4.12.0",
    "typing-extensions==4.15.0",
    "pywebio==1.7.0",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"