<!--
    时序数据生成页面 - 调用流程说明
    
    1. 页面访问: 用户访问 /time-series-generator 路由
       -> FastAPI 渲染此模板
    
    2. 页面初始化 (DOMContentLoaded):
       -> checkLoginStatus() - 检查登录状态
       -> 若未登录，显示登录弹窗
    
    3. 用户操作流程:
       a. 选择轨道区段 (trackSection)
       b. 选择故障类型 (errorType)
       c. 设置数据数量 (dataCount)、故障数据比例 (faultRatio)
       d. 设置衰耗盘端子 (r1, r2) 和电压参数
       e. 点击"开始时序数据生成"按钮
    
    4. 数据生成流程:
       -> startTimeSeriesSimulation() 被调用
       -> 循环调用 simulateSingle() 生成每组数据
       -> simulateSingle() 通过 POST /api/time_series_simulation 发送请求
       -> 服务器返回仿真结果，存入 simulationResults 数组
    
    5. 结果展示:
       -> 每组数据生成后调用 updateSimulationResult() 更新列表
       -> 若图表窗口已打开，调用 updateChart() 实时刷新图表
       -> 显示下载按钮，支持 CSV/JSON 格式导出
    
    6. 图表功能:
       -> 点击"查看数据图表"打开悬浮窗口
       -> 支持切换不同数据类型 (输入电压、轨面电压等)
       -> 图表使用 Chart.js 绘制
    
    7. 停止功能:
       -> 点击"停止生成"按钮调用 stopTimeSeriesSimulation()
       -> 取消所有待处理请求，保留已生成数据

        .modal h3 {

        .modal p {

            margin-bottom: 20px;

<body>
    <!-- 
        数字雨背景Canvas元素
        ======================
        这是数字雨效果的载体，JavaScript会在此canvas上绘制下落的数字字符。
        位置：放在body最开头，确保是第一个子元素
        样式：通过CSS设置为全屏背景，z-index:-1置于底层
    -->
    <canvas id="matrixCanvas"></canvas>
    
    <div class="login-section" id="userInfoSection" style="display: none;">
        <div class="user-info">
            <img id="userAvatar" class="user-avatar" src="" alt="头像" style="display: none;">

    <div class="overlay" id="overlay"></div>

    <div class="left-menu" id="leftMenu">

            <select id="trackSection" name="trackSection" onchange="onTrackSectionChange()">

                <option value="69G">69G</option>

                <option value="57G">57G</option>

        <div class="form-group">

                <option value="0">无故障</option>
                <option value="1">接收端调谐单元1断路</option>
                <option value="2">发送端调谐单元1断路</option>
                <option value="3">接收端空心线圈断路</option>
                <option value="4">接收端空芯线圈短路</option>
                <option value="5">接收端调谐单元2断路</option>
                <option value="6">补偿电容3断路</option>
                <option value="7">补偿电容3短路</option>
                <option value="8">发送端SPT电缆断路</option>
                <option value="9">接收端SPT电缆断路</option>
            </select>
        </div>
        <button class="save-btn" onclick="saveSelection()">保存选择</button>
    </div>

    <div class="right-menu" id="rightMenu">
        <div class="menu-header">
            <h2 class="menu-title">参数设置</h2>
            <button class="close-btn" onclick="closeParameterWindow()">&times;</button>
        </div>
        <div class="form-group">
            <label for="trackName">轨道名称:</label>
            <input type="text" id="trackName" name="trackName" value="测试轨道">
        </div>
        <div class="form-group">
            <label for="trackLength">轨道长度 (m):</label>
            <input type="number" id="trackLength" name="trackLength" value="1200.0" step="0.1">
        </div>
        <div class="form-group">
            <label for="resistance">电阻 (Ω/m):</label>
            <input type="number" id="resistance" name="resistance" value="0.1" step="0.01">
        </div>
        <div class="form-group">
            <label for="inductance">电感 (H/m):</label>
            <input type="number" id="inductance" name="inductance" value="0.001" step="0.0001">
        </div>
        <div class="form-group">

        <div class="form-group">

            <select id="r1" name="r1">
                <option value="1">1</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="9">9</option>
            </select>
        </div>
        <div class="form-group">
            <label for="r2">衰耗盘端子2:</label>
            <select id="r2" name="r2">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="7">7</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <div class="form-group">
            <label for="voltageLevel">发送端电平档位:</label>
            <select id="voltageLevel" name="voltageLevel">
                <option value="1">1档 (161-170V)</option>
                <option value="2">2档 (146-154V)</option>
                <option value="3" selected>3档 (128-135V)</option>
                <option value="4">4档 (104.5-110.5V)</option>
                <option value="5">5档 (75-79.5V)</option>
                <option value="6">6档 (75-170V)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="voltageCount">数据个数:</label>
            <input type="number" id="voltageCount" name="voltageCount" value="15" min="1" max="100" step="1">

        <div class="form-group">
            <label for="useRandomVoltage">随机电压:</label>
            <input type="checkbox" id="useRandomVoltage" name="useRandomVoltage">

        <div class="form-group">
            <label for="enablePerformanceEvaluation">性能评估:</label>
            <input type="checkbox" id="enablePerformanceEvaluation" name="enablePerformanceEvaluation" disabled>
        </div>
        <button class="save-btn" onclick="saveParameters()">保存参数</button>
    </div>

    <div class="container">
        <!-- 错误提示弹窗 -->
        <div class="modal-overlay" id="errorModal">
            <div class="modal">
                <h3>参数未设置</h3>
                <p id="modalMessage">请先设置轨道区段和故障类型</p>
                <button class="modal-btn" onclick="closeModal()">确定</button>
            </div>
        </div>

        <!-- 性能评估结果弹窗 -->
        <div class="modal-overlay" id="performanceEvalModal">
            <div class="modal" style="max-width: 90%; width: 1200px; max-height: 90vh; overflow-y: auto;">
                <h3 style="color: #27ae60; margin-top: 0; margin-bottom: 15px; font-size: 20px;">性能评估结果</h3>
                <div id="performanceEvalContent" style="color: #ccc; font-size: 14px; margin-bottom: 20px;"></div>
                <div id="performanceEvalCharts" style="margin-bottom: 20px;"></div>
                <button class="modal-btn" onclick="closePerformanceEvalModal()">关闭</button>
            </div>
        </div>
        
        <header>
            <h1>时序数据生成</h1>
            <p class="subtitle">铁路轨道电路故障模拟系统</p>
        </header>

        <div class="main-content">
            <div class="controls">
                <button class="btn btn-primary" id="startSimulationBtn" onclick="startTimeSeriesSimulation()">开始时序数据生成</button>
                <button class="btn btn-danger" id="stopSimulationBtn" onclick="stopTimeSeriesSimulation()" disabled>停止生成</button>
                <button class="btn btn-secondary" onclick="clearResults()">清空结果</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备开始...</div>
            </div>

            <div class="selection-status">
                <div class="status-item">
                    <span class="status-label">轨道区段:</span>
                    <span class="status-value" id="trackSectionValue">未选择</span>
                </div>
                <div class="status-item">
                    <span class="status-label">故障类型:</span>
                    <span class="status-value" id="faultTypeValue">未选择</span>
                </div>
                <div class="status-item">
                    <span class="status-label">仿真进度:</span>
                    <span class="status-value" id="resultStats">0 / 0</span>
                </div>
            </div>

            <!-- 轨道区段示意图和故障类型展示 -->
            <div class="railway-zone-container" style="margin: 30px 0; display: flex; gap: 20px; flex-wrap: wrap;">
                <!-- 轨道区段示意图 -->
                <div class="railway-zone" style="flex: 1; min-width: 300px; background-color: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #3498db;">
                    <h3 style="color: #3498db; margin-bottom: 15px;">轨道区段示意图</h3>
                    <div style="text-align: center; padding: 20px;">
                        <img id="railwayZoneImage" src="/static/images/railway_zone.png" alt="轨道区段示意图" style="max-width: 100%; height: auto; border-radius: 4px;">
                    </div>
                </div>
                
                <!-- 故障类型图片展示 -->
                <div class="fault-type-display" style="flex: 1; min-width: 300px; background-color: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #3498db;">
                    <h3 style="color: #3498db; margin-bottom: 15px;">故障类型展示</h3>
                    <div style="text-align: center; padding: 20px;">
                        <img id="faultTypeImage" src="/static/images/故障展示0.svg" alt="故障类型展示" style="max-width: 100%; height: auto; border-radius: 4px;">
                        <p id="faultTypeDescription" style="margin-top: 15px; color: #ccc;">无故障</p>
                    </div>
                </div>
            </div>

            <div class="result-section">
                <h2>生成结果</h2>

                    <p>请设置参数并点击"开始时序数据生成"按钮</p>

    <div class="eval-chart-floating-window" id="evalChartFloatingWindow">
        <div class="eval-window-header">
            <h3>性能评估图表</h3>
            <button class="close-eval-btn" onclick="closeEvalChartWindow()">&times;</button>
        </div>
        <div class="eval-window-content">
            <div class="eval-charts-container" id="evalChartsContainer"></div>
        </div>
    </div>

    <div class="eval-table-floating-window" id="evalTableFloatingWindow">
        <div class="eval-window-header">
            <h3>性能评估表格</h3>
            <button class="close-eval-btn" onclick="closeEvalTableWindow()">&times;</button>
        </div>
        <div class="eval-window-content">
            <div class="eval-table-container" id="evalTableContainer"></div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let currentUser = null;

        const faultTypeNames = {
            '0': '无故障',
            '1': '接收端调谐单元1断路',
            '2': '发送端调谐单元1断路',
            '3': '接收端空心线圈断路',
            '4': '接收端空芯线圈短路',
            '5': '接收端调谐单元2断路',
            '6': '补偿电容3断路',
            '7': '补偿电容3短路',
            '8': '发送端SPT电缆断路',
            '9': '接收端SPT电缆断路'
        };
        
        // 故障类型图片映射
        const faultTypeImages = {
            '0': '/static/images/故障展示0.svg',
            '1': '/static/images/故障展示1.svg',
            '2': '/static/images/故障展示2.svg',
            '3': '/static/images/故障展示3.svg',
            '4': '/static/images/故障展示4.svg',
            '5': '/static/images/故障展示5.svg',
            '6': '/static/images/故障展示6.svg',
            '7': '/static/images/故障展示7.svg',
            '8': '/static/images/故障展示8.svg',
            '9': '/static/images/故障展示9.svg'
        };

        const trackSectionParams = {
            '69G': { trackLength: 1200.0, cableLength: 10.0 },
            'X1LQG': { trackLength: 1100.0, cableLength: 8.0 },
            'IG1': { trackLength: 1300.0, cableLength: 12.0 },
            '57G': { trackLength: 1000.0, cableLength: 9.0 },
            '3DG': { trackLength: 1150.0, cableLength: 11.0 }
        };

        let currentSelection = { trackSection: '', faultType: '0' };

        let trackParameters = {
            trackName: "测试轨道",
            trackLength: 1200.0,
            resistance: 0.1,
            inductance: 0.001,
            capacitance: 1e-9,
            leakageResistance: 1.0,
            cableLength: 10.0,
            errorValue: 1.0,
            r1: 1,
            r2: 1
        };

        let simulationResults = [];
        let isSimulationRunning = false;
        let currentSimulationIndex = 0;
        let totalSimulationCount = 0;
        let abortControllers = [];
        let currentSessionId = null;
        let normalResults = [];
        let faultResults = [];
        let evaluationData = [];
        let isPerformanceEvaluationMode = false;

        function checkLoginStatus() {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                isLoggedIn = true;
                updateLoginUI();
            } else {
                isLoggedIn = false;
                currentUser = null;
                updateLoginUI();
                showLoginPrompt();
            }
        }

        function updateLoginUI() {
            const userInfoSection = document.getElementById('userInfoSection');
            const userName = document.getElementById('userName');
            if (isLoggedIn && currentUser) {
                userInfoSection.style.display = 'block';
                userName.textContent = currentUser.username;
                document.body.classList.add('logged-in');
                
                const avatarImg = document.getElementById('userAvatar');
                if (currentUser.avatar_path) {
                    avatarImg.src = `/${currentUser.avatar_path}`;
                    avatarImg.style.display = 'block';
                } else {
                    avatarImg.style.display = 'none';
                }
            } else {
                userInfoSection.style.display = 'none';
                document.body.classList.remove('logged-in');
            }
        }

        function showLoginPrompt() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="access-denied">
                    <h3>访问被拒绝</h3>
                    <p>请先登录以使用仿真系统功能</p>
                    <form class="login-form" onsubmit="event.preventDefault(); login()">
                        <div>
                            <label for="loginUsername">用户名:</label>
                            <input type="text" id="loginUsername" name="loginUsername" required>
                        </div>
                        <div>
                            <label for="loginPassword">密码:</label>
                            <input type="password" id="loginPassword" name="loginPassword" required>
                        </div>
                        <button type="submit" class="btn">登录</button>
                        <div class="login-error" id="loginError" style="display: none;"></div>
                    </form>
                    <div style="margin-top: 20px; text-align: center;">
                        <p style="color: #ccc; margin-bottom: 10px;">还没有账号？</p>
                        <a href="/register" class="btn" style="background-color: #27ae60; text-decoration: none;">立即注册</a>
                    </div>
                </div>
            `;
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            // 后门账户：用于快速功能检查，无需后端验证
            if (username === 'admin' && password === '1234') {
                isLoggedIn = true;
                currentUser = {
                    username: 'admin',
                    avatar_path: null
                };
                localStorage.setItem('user', JSON.stringify(currentUser));
                window.location.reload();
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' },
                    credentials: 'include'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    isLoggedIn = true;
                    currentUser = { 
                        username: result.user.username,
                        avatar_path: result.user.avatar_path 
                    };
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    window.location.reload();
                } else {
                    const loginError = document.getElementById('loginError');
                    loginError.textContent = result.message || '登录失败';
                    loginError.style.display = 'block';
                }
            } catch (error) {
                console.error('登录失败:', error);
                const loginError = document.getElementById('loginError');
                loginError.textContent = '登录验证失败，请稍后重试';
                loginError.style.display = 'block';
            }
        }

        function logout() {
            isLoggedIn = false;
            currentUser = null;
            localStorage.removeItem('user');
            window.location.reload();
        }

        function openLeftMenu() {
            document.getElementById('leftMenu').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeLeftMenu() {
            document.getElementById('leftMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function onTrackSectionChange() {
            const section = document.getElementById('trackSection').value;
            if (section && trackSectionParams[section]) {
                const params = trackSectionParams[section];
                document.getElementById('trackLength').value = params.trackLength;
                document.getElementById('cableLength').value = params.cableLength;
            }
        }

        function updateFaultTypeImage(faultType) {
            const faultTypeImage = document.getElementById('faultTypeImage');
            const faultTypeDescription = document.getElementById('faultTypeDescription');
            if (faultTypeImages[faultType]) {
                faultTypeImage.src = faultTypeImages[faultType];
            }
            if (faultTypeNames[faultType]) {
                faultTypeDescription.textContent = faultTypeNames[faultType];
            }
        }

        function onFaultTypeChange() {
            const faultType = document.getElementById('faultType').value;
            const performanceEvalCheckbox = document.getElementById('enablePerformanceEvaluation');

            if (faultType === '0') {
                performanceEvalCheckbox.disabled = true;
                performanceEvalCheckbox.checked = false;
            } else {
                performanceEvalCheckbox.disabled = false;
            }
        }

        function saveSelection() {
            const section = document.getElementById('trackSection').value;
            const faultType = document.getElementById('faultType').value;
            if (!section) {
                showStatusMessage('请选择轨道区段！', 'error');
                alert('请选择轨道区段！');
                return;
            }
            currentSelection.trackSection = section;
            currentSelection.faultType = faultType;
            document.getElementById('trackSectionValue').textContent = section;
            document.getElementById('faultTypeValue').textContent = faultTypeNames[faultType];
            // 更新故障类型图片
            updateFaultTypeImage(faultType);
            showStatusMessage('选择已保存！', 'success');
            closeLeftMenu();
        }

        function openParameterWindow() {
            document.getElementById('trackName').value = trackParameters.trackName;
            document.getElementById('trackLength').value = trackParameters.trackLength;
            document.getElementById('resistance').value = trackParameters.resistance;
            document.getElementById('inductance').value = trackParameters.inductance;
            document.getElementById('capacitance').value = trackParameters.capacitance;
            document.getElementById('leakageResistance').value = trackParameters.leakageResistance;
            document.getElementById('cableLength').value = trackParameters.cableLength;
            document.getElementById('errorValue').value = trackParameters.errorValue;
            document.getElementById('r1').value = trackParameters.r1;
            document.getElementById('r2').value = trackParameters.r2;
            document.getElementById('rightMenu').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeParameterWindow() {
            document.getElementById('rightMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function saveParameters() {
            // 验证轨道长度
            const trackLengthInput = document.getElementById('trackLength').value;
            const trackLengthValue = parseFloat(trackLengthInput);
            
            if (trackLengthValue < 0) {
                alert('轨道长度不能为负数！');
                return;
            }
            
            trackParameters = {
                trackName: document.getElementById('trackName').value,
                trackLength: parseFloat(trackLengthInput),
                resistance: parseFloat(document.getElementById('resistance').value),
                inductance: parseFloat(document.getElementById('inductance').value),
                capacitance: parseFloat(document.getElementById('capacitance').value),
                leakageResistance: parseFloat(document.getElementById('leakageResistance').value),
                cableLength: parseFloat(document.getElementById('cableLength').value),
                errorValue: parseFloat(document.getElementById('errorValue').value),
                r1: parseInt(document.getElementById('r1').value),
                r2: parseInt(document.getElementById('r2').value)
            };
            showStatusMessage('参数已保存！', 'success');
            closeParameterWindow();
        }

        /**
         * 显示状态消息提示
         * 
         * 功能说明：
         * 在页面顶部创建一个悬浮的消息提示框，显示成功或错误信息，
         * 3秒后自动消失，提供用户操作反馈
         * 
         * 参数说明：
         * @param {string} message - 要显示的消息内容
         * @param {string} type - 消息类型，可选值：
         *   - 'success': 成功消息（绿色样式）
         *   - 'error': 错误消息（红色样式）
         *   - 'info': 信息消息（蓝色样式）
         * 
         * 实现原理：
         * 1. 动态创建一个div元素
         * 2. 设置CSS类名（用于样式控制）
         * 3. 添加到页面主容器中
         * 4. 3秒后开始淡出动画
         * 5. 动画结束后从DOM中移除元素
         * 
         * 使用场景：
         * - 保存选择成功/失败提示
         * - 数据生成进度提示
         * - 下载文件成功提示
         * - API请求结果反馈
         */
        function showStatusMessage(message, type) {
            const messageDiv = document.createElement('div');  // 创建消息容器div
            messageDiv.className = `status-message ${type}`;    // 设置CSS类名：status-message + 类型
            messageDiv.textContent = message;                  // 设置消息文本内容

        function runPerformanceEvaluationForTimeSeries() {
            normalResults = simulationResults.filter(result => result.error_type === 0);
            faultResults = simulationResults.filter(result => result.error_type !== 0);

            if (normalResults.length === 0 || faultResults.length === 0) {
                showStatusMessage('性能评估需要同时包含无故障和故障数据！', 'error');
                return;
            }

            evaluationData = [];

            const maxLength = Math.max(normalResults.length, faultResults.length);
            for (let i = 0; i < maxLength; i++) {
                const normal = normalResults[i % normalResults.length];
                const fault = faultResults[i % faultResults.length];

                const sendEndDiff = normal.send_end_track_voltage !== 0
                    ? ((fault.send_end_track_voltage - normal.send_end_track_voltage) / normal.send_end_track_voltage * 100).toFixed(2)
                    : 0;
                const receiveEndDiff = normal.receive_end_track_voltage !== 0
                    ? ((fault.receive_end_track_voltage - normal.receive_end_track_voltage) / normal.receive_end_track_voltage * 100).toFixed(2)
                    : 0;
                const mainTrackDiff = normal.main_track_input_voltage !== 0
                    ? ((fault.main_track_input_voltage - normal.main_track_input_voltage) / normal.main_track_input_voltage * 100).toFixed(2)
                    : 0;

                evaluationData.push({
                    voltage: fault.voltage,
                    normal_send_end: normal.send_end_track_voltage,
                    fault_send_end: fault.send_end_track_voltage,
                    send_end_voltage_diff: parseFloat(sendEndDiff),
                    normal_receive_end: normal.receive_end_track_voltage,
                    fault_receive_end: fault.receive_end_track_voltage,
                    receive_end_voltage_diff: parseFloat(receiveEndDiff),
                    normal_main_track: normal.main_track_input_voltage,
                    fault_main_track: fault.main_track_input_voltage,
                    main_track_voltage_diff: parseFloat(mainTrackDiff)
                });
            }

            displayTimeSeriesEvaluationResult();
        }

        function getVoltageRange(level) {
            switch(level) {
                case 1:
                    return { min: 161, max: 170 };
                case 2:
                    return { min: 146, max: 154 };
                case 3:
                    return { min: 128, max: 135 };
                case 4:
                    return { min: 104.5, max: 110.5 };
                case 5:
                    return { min: 75, max: 79.5 };
                default:
                    return { min: 75, max: 170 };
            }
        }

        function generateVoltageValues() {
            const voltageLevel = parseInt(document.getElementById('voltageLevel').value);
            const useRandomVoltage = document.getElementById('useRandomVoltage').checked;
            const voltageCount = parseInt(document.getElementById('voltageCount').value);
            
            const range = getVoltageRange(voltageLevel);
            const voltageValues = [];
            
            if (useRandomVoltage) {
                // 生成随机电压值
                for (let i = 0; i < voltageCount; i++) {
                    const voltage = range.min + Math.random() * (range.max - range.min);
                    voltageValues.push(parseFloat(voltage.toFixed(1)));
                }
                // 排序
                voltageValues.sort((a, b) => a - b);
            } else {
                // 生成均匀分布的电压值
                const step = (range.max - range.min) / (voltageCount - 1);
                for (let i = 0; i < voltageCount; i++) {
                    const voltage = range.min + i * step;
                    voltageValues.push(parseFloat(voltage.toFixed(1)));
                }
            }
            
            return voltageValues;
        }

        async function simulateSingle(params) {
            const formData = new FormData();
            formData.append('trail', `time_series_${Date.now()}_${Math.floor(Math.random() * 1000)}`);
            formData.append('error_type', params.error_type);
            formData.append('error_value', params.error_value);
            formData.append('error_position', params.section_id);
            formData.append('track_length', params.track_length);
            formData.append('resist_per_meter', params.resistance);
            formData.append('induct_per_meter', params.inductance);
            formData.append('capacit_per_meter', params.capacitance);
            formData.append('conduct_per_meter', 1.0 / (params.leakage_resistance * 1000));
            formData.append('frequency', params.frequency);
            formData.append('spt_cable_length', params.spt_cable_length);
            formData.append('r1', params.r1);
            formData.append('r2', params.r2);
            formData.append('input_V', params.voltage);

            try {
                if (!isSimulationRunning) throw new Error('模拟已停止');

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                try {
                    const response = await fetch(`/api/calculate/track-circuit?_=${Date.now()}`, {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal,
                        headers: { 'Accept': 'application/json' }
                    });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error(`API调用失败: ${response.status}`);
                    const result = await response.json();
                    if (result.status !== 'success') throw new Error(result.message || '模拟失败');
                    return result;
                } catch (error) {
                    clearTimeout(timeoutId);
                    throw error;
                }
            } catch (error) {
                console.error('模拟失败:', error);
                throw error;
            }
        }

        function processSimulationResult(simulation) {
            currentSimulationIndex++;
            if (simulation.error) {
                const errorMessage = simulation.error.message || simulation.error || '未知错误';
                const faultType = simulation.params.error_type || 0;
                const faultTypeName = faultTypeNames[faultType] || '无故障';
                addResultItem('error', `模拟失败 (电压: ${(simulation.params.voltage || 0).toFixed(1)}V, 故障类型: ${faultTypeName}): ${errorMessage}`);
            } else {
                const result = simulation.result;
                const params = simulation.params;
                if (!result) {
                    const faultType = params.error_type || 0;
                    const faultTypeName = faultTypeNames[faultType] || '无故障';
                    addResultItem('error', `模拟失败 (电压: ${(params.voltage || 0).toFixed(1)}V, 故障类型: ${faultTypeName}): 无效的模拟结果`);
                    return;
                }
                const voltageResults = result.voltage_results || {
                    send_end_track_voltage: 0,
                    receive_end_track_voltage: 0,
                    main_track_input_voltage: 0,
                    main_track_output_voltage_1: 0
                };
                const resultData = {
                    voltage: params.voltage,
                    section_id: params.section_id,
                    error_type: params.error_type,
                    track_length: params.track_length,
                    send_end_track_voltage: voltageResults.send_end_track_voltage || 0,
                    receive_end_track_voltage: voltageResults.receive_end_track_voltage || 0,
                    main_track_input_voltage: voltageResults.main_track_input_voltage || 0,
                    main_track_output_voltage_1: voltageResults.main_track_output_voltage_1 || 0,
                    input_impedance: result.input_impedance || 0,
                    input_current: result.input_current || 0,
                    timestamp: new Date().toISOString()
                };
                simulationResults.push(resultData);

                const faultType = params.error_type || 0;
                const faultTypeName = faultTypeNames[faultType] || '无故障';
                addResultItem('success', `模拟成功 (电压: ${(params.voltage || 0).toFixed(1)}V, 故障类型: ${faultTypeName}) - 送端轨面电压: ${(voltageResults.send_end_track_voltage || 0).toFixed(2)}V, 受端轨面电压: ${(voltageResults.receive_end_track_voltage || 0).toFixed(2)}V, 主轨入电压: ${(voltageResults.main_track_input_voltage || 0).toFixed(2)}V, 轨出1电压: ${(voltageResults.main_track_output_voltage_1 || 0).toFixed(2)}V`);
                showToggleButton();
                showChartToggleButton();
                updateSimulationResult();

                // 如果图表窗口已经打开，实时刷新图表
                const chartWindow = document.getElementById('chartFloatingWindow');
                if (chartWindow && chartWindow.classList.contains('active')) {
                    updateChart();
                }
            }
            const progress = (currentSimulationIndex / totalSimulationCount) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('resultStats').textContent = `${currentSimulationIndex} / ${totalSimulationCount}`;
        }

            if (simulationResults.length > 0) {

                    for (const result of simulationResults) {

            }
        }

        async function startTimeSeriesSimulation() {
            // 检查是否已经在运行
            if (isSimulationRunning) {
                showStatusMessage('模拟正在进行中，请先停止后再试！', 'error');
                return;
            }

            // 检查轨道区段是否设置
            if (!currentSelection.trackSection) {
                showModal('请先选择轨道区段！');
                return;
            }

            // 检查故障类型是否设置
            if (!currentSelection.faultType || currentSelection.faultType === '') {
                showModal('请先选择故障类型！');
                return;
            }

            // 检查是否启用了性能评估模式
            const enablePerformanceEvaluation = document.getElementById('enablePerformanceEvaluation').checked;
            isPerformanceEvaluationMode = enablePerformanceEvaluation;

            const sectionId = currentSelection.trackSection;
            const selectedErrorType = parseInt(currentSelection.faultType);
            const { trackLength, resistance, inductance, capacitance, leakageResistance, cableLength, errorValue, r1, r2 } = trackParameters;
            
            let frequency;
            if (sectionId === "69G" || sectionId === "X1LQG" || sectionId === "IG1") {
                frequency = 1700;
            } else if (sectionId === "57G" || sectionId === "3DG") {
                frequency = 2300;
            } else {
                frequency = 1700;
            }

            const voltageValues = generateVoltageValues();
            const halfLength = Math.ceil(voltageValues.length / 2);
            const noFaultVoltages = voltageValues.slice(0, halfLength);
            const faultVoltages = voltageValues.slice(halfLength);
            totalSimulationCount = voltageValues.length;
            if (totalSimulationCount <= 0) {
                alert('无效的电压设置');
                return;
            }

            // 记录用户选择的参数
            try {
                await fetch('/api/log-selection', {
                    method: 'POST',
                    body: new URLSearchParams({
                        section_id: sectionId,
                        section_name: sectionId,
                        fault_type: selectedErrorType,
                        fault_type_name: currentSelection.faultTypeName || currentSelection.faultType,
                        fault_value: errorValue,
                        track_length: trackLength,
                        cable_length: cableLength,
                        frequency: frequency || 1700,
                        voltage_range: `时序数据生成 - ${voltageValues.length}个数据点`,
                        voltage_count: voltageValues.length,
                        data_type: 'time_series',
                        evaluation_type: 'time_series'
                    })
                });
            } catch (error) {
                console.error('记录参数失败:', error);
            }

            simulationResults = [];
            isSimulationRunning = true;
            currentSimulationIndex = 0;

            // 清除旧的CSV文件
            try {
                await fetch('/api/time-series/clear-csv', { method: 'POST' });
            } catch (error) {
                console.error('清除CSV文件失败:', error);
            }

            document.getElementById('startSimulationBtn').disabled = true;
            document.getElementById('stopSimulationBtn').disabled = false;
            document.getElementById('downloadButtons').style.display = 'none';
            document.getElementById('resultContent').innerHTML = '<p class="result-item info">正在准备时序数据生成...</p>';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressText').textContent = '准备开始...';

            try {

                // 先生成无故障数据
                document.getElementById('progressText').textContent = '正在生成无故障数据...';
                for (let i = 0; i < noFaultVoltages.length; i++) {
                    if (!isSimulationRunning) break;
                    const voltage = noFaultVoltages[i];
                    const params = {
                        section_id: sectionId,
                        frequency: frequency,
                        error_type: 0, // 无故障
                        error_value: errorValue,
                        track_length: trackLength,
                        resistance: resistance,
                        inductance: inductance,
                        capacitance: capacitance,
                        leakage_resistance: leakageResistance,
                        spt_cable_length: cableLength,
                        r1: r1,
                        r2: r2,
                        voltage: voltage
                    };
                    try {
                        const result = await simulateSingle(params);
                        processSimulationResult({ params, result });
                    } catch (error) {
                        console.error('模拟失败:', error);
                        processSimulationResult({ params, error: error });
                    }
                    // 在请求之间添加延迟，让连接有机会关闭
                    await delay(1000);
                }

                // 再生成选定故障类型的数据
                document.getElementById('progressText').textContent = '正在生成故障数据...';
                for (let i = 0; i < faultVoltages.length; i++) {
                    if (!isSimulationRunning) break;
                    const voltage = faultVoltages[i];
                    const params = {
                        section_id: sectionId,
                        frequency: frequency,
                        error_type: selectedErrorType,
                        error_value: errorValue,
                        track_length: trackLength,
                        resistance: resistance,
                        inductance: inductance,
                        capacitance: capacitance,
                        leakage_resistance: leakageResistance,
                        spt_cable_length: cableLength,
                        r1: r1,
                        r2: r2,
                        voltage: voltage
                    };
                    try {
                        const result = await simulateSingle(params);
                        processSimulationResult({ params, result });
                    } catch (error) {
                        console.error('模拟失败:', error);
                        processSimulationResult({ params, error: error });
                    }
                    // 在请求之间添加延迟，让连接有机会关闭
                    await delay(1000);
                }
            } catch (error) {
                console.error('时序数据生成失败:', error);
                addResultItem('error', `时序数据生成失败: ${error.message}`);
            } finally {
                finishTimeSeriesSimulation();
            }
        }

        function downloadCSV() {

            simulationResults.forEach(item => {
                csvContent += `${item.voltage.toFixed(1)},${item.send_end_track_voltage.toFixed(2)},${item.receive_end_track_voltage.toFixed(2)},${item.main_track_input_voltage.toFixed(2)},${item.main_track_output_voltage_1.toFixed(2)},${item.input_impedance.toFixed(2)},${item.input_current.toFixed(4)},${item.timestamp}\n`;

            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `time_series_data_${new Date().toISOString().slice(0, 19).replace(/[-:]/g, '')}.csv`);

        /**
         * 下载JSON文件功能
         * 
         * 实现原理：
         * 1. 将JavaScript数组对象转换为JSON字符串
         * 2. 创建Blob对象（Binary Large Object）存储二进制数据
         * 3. 通过URL.createObjectURL()生成临时下载链接
         * 4. 创建隐藏的<a>元素模拟点击下载
         * 5. 下载完成后清理临时资源
         * 
         * 数据来源：
         * - simulationResults: 全局数组，存储所有生成的时序仿真数据
         * - 每个元素包含：error_type, voltage, 各种电压参数, timestamp等
         */
        function downloadJSON() {
            // 步骤1: 检查是否有可下载的数据
            if (simulationResults.length === 0) {
                showStatusMessage('没有数据可下载！', 'error');
                return;
            }
            
            // 步骤2: 将JavaScript对象转换为格式化的JSON字符串
            // JSON.stringify(array, null, 2) 第三个参数2表示缩进空格数，使输出更易读
            const jsonContent = JSON.stringify(simulationResults, null, 2);
            
            // 步骤3: 创建Blob对象
            // Blob是浏览器支持的二进制大对象，用于存储原始数据
            // type: 'application/json' 告诉浏览器这是JSON格式文件
            // charset=utf-8 确保中文字符正确编码
            const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
            
            // 步骤4: 生成临时下载URL
            // URL.createObjectURL(blob) 为Blob对象创建一个唯一的临时URL
            // 格式类似: blob:http://127.0.0.1:8000/xxxxxxx-xxxx-xxxx
            // 此URL仅在当前文档生命周期内有效
            const url = URL.createObjectURL(blob);
            
            // 步骤5: 创建隐藏的下载链接元素
            const link = document.createElement('a');
            link.setAttribute('href', url);                                    // 设置下载资源的URL
            link.setAttribute('download', `time_series_data_${new Date().toISOString().slice(0, 19).replace(/[-:]/g, '')}.json`);
            // download属性指定下载文件名
            // 文件名格式: time_series_data_20260429Txxxxxx.json
            // new Date().toISOString() -> "2026-04-29T15:30:45.123Z"
            // .slice(0, 19) -> "2026-04-29T15:30:45"
            // .replace(/[-:]/g, '') -> "20260429T153045"
            
            link.style.visibility = 'hidden';  // 隐藏链接元素，不影响页面布局
            
            // 步骤6: 模拟点击触发下载
            document.body.appendChild(link);  // 将链接添加到DOM
            link.click();                     // 触发点击事件，浏览器开始下载
            
            // 步骤7: 清理临时资源
            document.body.removeChild(link);   // 从DOM中移除链接元素
            // URL.revokeObjectURL(url);        // 释放URL对象（可选，浏览器会自动清理）
            
            // 步骤8: 显示下载成功提示
            showStatusMessage('JSON文件下载成功！', 'success');
        }

    <script>
        // ========================================================================
        //                        数字雨效果实现
        // ========================================================================
        // 
        // 数字雨(Matrix Rain)效果原理说明：
        // ================================
        // 1. 灵感来源：电影《黑客帝国》中的经典数字雨场景
        // 2. 实现方式：使用HTML5 Canvas 2D绑制API
        // 3. 核心原理：
        //    a. 将屏幕按字体大小分割成列
        //    b. 每列有一个"雨滴"从顶部下落
        //    c. 雨滴由随机数字字符组成
        //    d. 使用半透明背景制造拖尾效果
        //    e. 雨滴到达底部后随机重新从顶部开始
        //
        // 实现步骤：
        // =========
        // 1. 获取canvas元素和2D绑制上下文
        // 2. 设置canvas尺寸为窗口大小
        // 3. 定义数字字符集（0和1的交替字符串）
        // 4. 创建数组存储每列雨滴的当前y坐标
        // 5. 绑制函数：
        //    a. 填充半透明黑色背景（制造拖尾）
        //    b. 遍历每列，绑制当前位置的字符
        //    c. 移动雨滴位置
        //    d. 检测是否到达底部，随机重置
        // 6. 使用setInterval循环绑制动画
        //
        // 关键技术点：
        // ==========
        // - 使用半透明背景(alpha=0.05)实现拖尾效果
        // - Math.random() > 0.975 控制雨滴重置概率
        // - 字符集使用"01"重复，产生二进制数字雨效果
        // - 绿色(#0F0)字体颜色，模拟黑客帝国风格
        // ========================================================================

        function initMatrix() {
            // 获取canvas元素
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸为窗口大小
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 数字字符集 - 使用0和1的交替字符串，产生二进制数字雨效果
            const chars = "01010101010101010101010101010101";
            const charArray = chars.split("");
            
            // 字体大小和列数计算
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            
            // drops数组存储每列雨滴的当前y坐标，初始值为1（顶部）
            const drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }
            
            // 核心绑制函数
            function draw() {
                // 关键技术：使用半透明黑色背景制造拖尾效果
                // rgba(0, 0, 0, 0.05) 表示5%不透明度的黑色
                // 每次绑制都覆盖一层半透明背景，使之前的字符逐渐淡出
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 设置字符颜色为绿色，模拟黑客帝国风格
                ctx.fillStyle = "#0F0";
                ctx.font = fontSize + "px arial";
                
                // 遍历每一列
                for (let i = 0; i < drops.length; i++) {
                    // 从字符集中随机选择一个字符
                    const text = charArray[Math.floor(Math.random() * charArray.length)];
                    
                    // 在当前位置绑制字符
                    // x坐标: i * fontSize（每列间隔一个字体宽度）
                    // y坐标: drops[i] * fontSize（雨滴当前位置）
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    // 检测雨滴是否到达底部且满足随机条件
                    // Math.random() > 0.975 表示约2.5%的概率重置
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;  // 重置到顶部
                    }
                    
                    // 移动雨滴位置（向下移动一个字符高度）
                    drops[i]++;
                }
            }
            
            // 设置动画循环，每33毫秒绑制一次（约30fps）
            setInterval(draw, 33);
        }

        // 页面加载完成后初始化数字雨
        window.addEventListener('load', initMatrix);
        
        // 窗口大小改变时重新设置canvas尺寸
        window.addEventListener('resize', function() {
            const canvas = document.getElementById('matrixCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
