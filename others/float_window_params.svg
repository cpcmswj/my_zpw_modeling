<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="headerGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#219653"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="#121212" rx="8"/>
  
  <!-- 标题 -->
  <text x="400" y="45" text-anchor="middle" fill="#27ae60" font-size="24" font-weight="bold">悬浮窗界面展示 - 输入参数</text>
  <text x="400" y="70" text-anchor="middle" fill="#999" font-size="14">用于设置轨道电路仿真参数的配置窗口</text>
  
  <!-- 悬浮窗主体 -->
  <rect x="50" y="100" width="700" height="380" rx="10" fill="#1e1e1e" stroke="#27ae60" stroke-width="3"/>
  
  <!-- 标题栏 -->
  <rect x="50" y="100" width="700" height="50" rx="10 10 0 0" fill="url(#headerGradient2)"/>
  <text x="100" y="135" fill="white" font-size="16" font-weight="bold">⚙️ 参数配置窗口</text>
  
  <!-- 关闭按钮 -->
  <rect x="670" y="110" width="30" height="30" rx="4" fill="#e74c3c"/>
  <text x="685" y="132" text-anchor="middle" fill="white" font-size="22" font-weight="bold">×</text>
  
  <!-- 参数区域 -->
  <rect x="60" y="165" width="320" height="315" rx="6" fill="#2a2a2a"/>
  <text x="120" y="188" fill="#3498db" font-size="14" font-weight="bold">轨道参数</text>
  
  <!-- 参数项1 -->
  <text x="80" y="220" fill="#ccc" font-size="12">轨道名称:</text>
  <rect x="180" y="212" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="228" fill="#fff" font-size="11">测试轨道</text>
  
  <!-- 参数项2 -->
  <text x="80" y="255" fill="#ccc" font-size="12">轨道长度 (m):</text>
  <rect x="180" y="247" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="263" fill="#fff" font-size="11">1200.0</text>
  
  <!-- 参数项3 -->
  <text x="80" y="290" fill="#ccc" font-size="12">电阻 (Ω/m):</text>
  <rect x="180" y="282" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="298" fill="#fff" font-size="11">0.1</text>
  
  <!-- 参数项4 -->
  <text x="80" y="325" fill="#ccc" font-size="12">电感 (H/m):</text>
  <rect x="180" y="317" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="333" fill="#fff" font-size="11">0.001</text>
  
  <!-- 参数项5 -->
  <text x="80" y="360" fill="#ccc" font-size="12">电容 (F/m):</text>
  <rect x="180" y="352" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="368" fill="#fff" font-size="11">1e-9</text>
  
  <!-- 参数项6 -->
  <text x="80" y="395" fill="#ccc" font-size="12">电缆长度 (km):</text>
  <rect x="180" y="387" width="160" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="200" y="403" fill="#fff" font-size="11">10.0</text>
  
  <!-- 右侧参数区域 -->
  <rect x="395" y="165" width="320" height="315" rx="6" fill="#2a2a2a"/>
  <text x="455" y="188" fill="#e74c3c" font-size="14" font-weight="bold">故障设置</text>
  
  <!-- 故障类型选择 -->
  <text x="415" y="220" fill="#ccc" font-size="12">故障类型:</text>
  <rect x="500" y="212" width="170" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="520" y="228" fill="#fff" font-size="11">接收端调谐单元1断路</text>
  
  <!-- 故障值 -->
  <text x="415" y="255" fill="#ccc" font-size="12">故障值:</text>
  <rect x="500" y="247" width="100" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="520" y="263" fill="#fff" font-size="11">1.0</text>
  
  <!-- 衰耗盘端子 -->
  <text x="415" y="290" fill="#ccc" font-size="12">衰耗盘端子1:</text>
  <rect x="520" y="282" width="60" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="535" y="298" fill="#fff" font-size="11">1</text>
  
  <text x="415" y="325" fill="#ccc" font-size="12">衰耗盘端子2:</text>
  <rect x="520" y="317" width="60" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="535" y="333" fill="#fff" font-size="11">2</text>
  
  <!-- 发送端电平档位 -->
  <text x="415" y="360" fill="#ccc" font-size="12">发送端电平档位:</text>
  <rect x="540" y="352" width="130" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="560" y="368" fill="#fff" font-size="11">3档 (128-135V)</text>
  
  <!-- 数据个数 -->
  <text x="415" y="395" fill="#ccc" font-size="12">数据个数:</text>
  <rect x="500" y="387" width="80" height="24" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="520" y="403" fill="#fff" font-size="11">15</text>
  
  <!-- 随机电压复选框 -->
  <rect x="500" y="420" width="18" height="18" rx="3" fill="#333" stroke="#3498db" stroke-width="1"/>
  <rect x="503" y="423" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="525" y="435" fill="#ccc" font-size="12">随机电压</text>
  
  <!-- 底部按钮 -->
  <rect x="580" y="420" width="135" height="35" rx="4" fill="#27ae60"/>
  <text x="647" y="442" text-anchor="middle" fill="white" font-size="13">保存参数</text>
</svg>