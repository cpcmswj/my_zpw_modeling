<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600">
  <!-- 背景 -->
  <rect width="700" height="600" fill="#121212" rx="8"/>
  
  <!-- 标题 -->
  <text x="350" y="40" text-anchor="middle" fill="#3498db" font-size="26" font-weight="bold">参数设置窗口 - 右侧悬浮菜单</text>
  <text x="350" y="65" text-anchor="middle" fill="#999" font-size="14">right-menu</text>
  
  <!-- 主容器 -->
  <rect x="50" y="90" width="600" height="480" rx="10" fill="#1e1e1e" stroke="#3498db" stroke-width="3"/>
  
  <!-- 标题栏 -->
  <rect x="50" y="90" width="600" height="50" rx="10 10 0 0" fill="#1e1e1e"/>
  <rect x="50" y="137" width="600" height="3" fill="#3498db"/>
  
  <!-- 标题文字 -->
  <text x="80" y="122" fill="#3498db" font-size="20" font-weight="bold">参数设置</text>
  
  <!-- 关闭按钮 -->
  <rect x="610" y="102" width="28" height="28" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="624" y="123" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">×</text>
  
  <!-- 表单项1: 轨道名称 -->
  <text x="80" y="170" fill="#ccc" font-size="13" font-weight="bold">轨道名称:</text>
  <rect x="180" y="160" width="400" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="179" fill="#fff" font-size="12">测试轨道</text>
  
  <!-- 表单项2: 轨道长度 -->
  <text x="80" y="210" fill="#ccc" font-size="13" font-weight="bold">轨道长度 (m):</text>
  <rect x="180" y="200" width="200" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="219" fill="#fff" font-size="12">1200.0</text>
  
  <!-- 表单项3: 电阻 -->
  <text x="400" y="210" fill="#ccc" font-size="13" font-weight="bold">电阻 (Ω/m):</text>
  <rect x="500" y="200" width="80" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="515" y="219" fill="#fff" font-size="12">0.1</text>
  
  <!-- 表单项4: 电感 -->
  <text x="80" y="250" fill="#ccc" font-size="13" font-weight="bold">电感 (H/m):</text>
  <rect x="180" y="240" width="200" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="259" fill="#fff" font-size="12">0.001</text>
  
  <!-- 表单项5: 电容 -->
  <text x="400" y="250" fill="#ccc" font-size="13" font-weight="bold">电容 (F/m):</text>
  <rect x="500" y="240" width="80" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="515" y="259" fill="#fff" font-size="12">1e-9</text>
  
  <!-- 表单项6: 漏电阻抗 -->
  <text x="80" y="290" fill="#ccc" font-size="13" font-weight="bold">漏电阻抗 (Ω·km):</text>
  <rect x="180" y="280" width="200" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="299" fill="#fff" font-size="12">1.0</text>
  
  <!-- 表单项7: 电缆长度 -->
  <text x="400" y="290" fill="#ccc" font-size="13" font-weight="bold">电缆长度 (km):</text>
  <rect x="500" y="280" width="80" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="515" y="299" fill="#fff" font-size="12">10.0</text>
  
  <!-- 表单项8: 故障值 -->
  <text x="80" y="330" fill="#ccc" font-size="13" font-weight="bold">故障值:</text>
  <rect x="180" y="320" width="200" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="339" fill="#fff" font-size="12">1.0</text>
  
  <!-- 表单项9: 衰耗盘端子1 -->
  <text x="400" y="330" fill="#ccc" font-size="13" font-weight="bold">衰耗盘端子1:</text>
  <rect x="500" y="320" width="60" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="515" y="339" fill="#fff" font-size="12">1</text>
  
  <!-- 表单项10: 衰耗盘端子2 -->
  <text x="80" y="370" fill="#ccc" font-size="13" font-weight="bold">衰耗盘端子2:</text>
  <rect x="180" y="360" width="60" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="195" y="379" fill="#fff" font-size="12">2</text>
  
  <!-- 表单项11: 发送端电平档位 -->
  <text x="80" y="410" fill="#ccc" font-size="13" font-weight="bold">发送端电平档位:</text>
  <rect x="200" y="400" width="180" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="215" y="419" fill="#fff" font-size="12">3档 (128-135V)</text>
  
  <!-- 下拉箭头 -->
  <text x="365" y="419" fill="#3498db" font-size="12">▼</text>
  
  <!-- 表单项12: 数据个数 -->
  <text x="400" y="410" fill="#ccc" font-size="13" font-weight="bold">数据个数:</text>
  <rect x="500" y="400" width="80" height="28" rx="4" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="515" y="419" fill="#fff" font-size="12">15</text>
  
  <!-- 表单项13: 随机电压 -->
  <rect x="80" y="445" width="18" height="18" rx="3" fill="#333" stroke="#3498db" stroke-width="1"/>
  <rect x="83" y="448" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="105" y="459" fill="#ccc" font-size="13">随机电压</text>
  
  <!-- 保存按钮 -->
  <rect x="80" y="500" width="530" height="45" rx="4" fill="#3498db"/>
  <text x="345" y="529" text-anchor="middle" fill="white" font-size="16" font-weight="bold">保存参数</text>
  
  <!-- 说明文字 -->
  <text x="350" y="575" text-anchor="middle" fill="#666" font-size="11">输入完成后点击"保存参数"按钮应用设置</text>
</svg>