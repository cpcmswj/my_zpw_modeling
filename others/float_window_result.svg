<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="#121212" rx="8"/>
  
  <!-- 标题 -->
  <text x="400" y="45" text-anchor="middle" fill="#3498db" font-size="24" font-weight="bold">悬浮窗界面展示 - 结果观察</text>
  <text x="400" y="70" text-anchor="middle" fill="#999" font-size="14">用于展示仿真结果的数据表格和图表窗口</text>
  
  <!-- 悬浮窗主体 -->
  <rect x="50" y="100" width="700" height="380" rx="10" fill="#1e1e1e" stroke="#3498db" stroke-width="3"/>
  
  <!-- 标题栏 -->
  <rect x="50" y="100" width="700" height="50" rx="10 10 0 0" fill="url(#headerGradient)"/>
  <text x="100" y="135" fill="white" font-size="16" font-weight="bold">📊 仿真结果观察窗口</text>
  
  <!-- 关闭按钮 -->
  <rect x="670" y="110" width="30" height="30" rx="4" fill="#e74c3c"/>
  <text x="685" y="132" text-anchor="middle" fill="white" font-size="22" font-weight="bold">×</text>
  
  <!-- 标签页切换 -->
  <rect x="60" y="165" width="120" height="35" rx="4" fill="#3498db"/>
  <text x="120" y="188" text-anchor="middle" fill="white" font-size="13">数据表格</text>
  
  <rect x="185" y="165" width="120" height="35" rx="4" fill="#2a2a2a" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="188" text-anchor="middle" fill="#999" font-size="13">图表展示</text>
  
  <rect x="310" y="165" width="120" height="35" rx="4" fill="#2a2a2a" stroke="#3498db" stroke-width="1"/>
  <text x="370" y="188" text-anchor="middle" fill="#999" font-size="13">统计分析</text>
  
  <!-- 数据表格区域 -->
  <rect x="60" y="210" width="680" height="220" rx="6" fill="#2a2a2a"/>
  
  <!-- 表格标题行 -->
  <rect x="65" y="220" width="670" height="28" fill="#3498db"/>
  <text x="100" y="240" fill="white" font-size="11" font-weight="bold">序号</text>
  <text x="180" y="240" fill="white" font-size="11" font-weight="bold">电压(V)</text>
  <text x="280" y="240" fill="white" font-size="11" font-weight="bold">送端轨面(V)</text>
  <text x="390" y="240" fill="white" font-size="11" font-weight="bold">受端轨面(V)</text>
  <text x="500" y="240" fill="white" font-size="11" font-weight="bold">主轨入(V)</text>
  <text x="610" y="240" fill="white" font-size="11" font-weight="bold">轨出1(V)</text>
  
  <!-- 表格数据行 -->
  <line x1="65" y1="255" x2="735" y2="255" stroke="#333"/>
  <text x="100" y="270" fill="#ccc" font-size="11">1</text>
  <text x="180" y="270" fill="#ccc" font-size="11">128.5</text>
  <text x="280" y="270" fill="#27ae60" font-size="11">105.2</text>
  <text x="390" y="270" fill="#27ae60" font-size="11">98.3</text>
  <text x="500" y="270" fill="#27ae60" font-size="11">15.6</text>
  <text x="610" y="270" fill="#27ae60" font-size="11">12.4</text>
  
  <line x1="65" y1="285" x2="735" y2="285" stroke="#333"/>
  <text x="100" y="300" fill="#ccc" font-size="11">2</text>
  <text x="180" y="300" fill="#ccc" font-size="11">130.2</text>
  <text x="280" y="300" fill="#27ae60" font-size="11">106.8</text>
  <text x="390" y="300" fill="#e74c3c" font-size="11">45.2</text>
  <text x="500" y="300" fill="#e74c3c" font-size="11">8.2</text>
  <text x="610" y="300" fill="#e74c3c" font-size="11">6.5</text>
  
  <line x1="65" y1="315" x2="735" y2="315" stroke="#333"/>
  <text x="100" y="330" fill="#ccc" font-size="11">3</text>
  <text x="180" y="330" fill="#ccc" font-size="11">132.8</text>
  <text x="280" y="330" fill="#27ae60" font-size="11">108.5</text>
  <text x="390" y="330" fill="#27ae60" font-size="11">102.1</text>
  <text x="500" y="330" fill="#27ae60" font-size="11">16.2</text>
  <text x="610" y="330" fill="#27ae60" font-size="11">12.9</text>
  
  <line x1="65" y1="345" x2="735" y2="345" stroke="#333"/>
  <text x="100" y="360" fill="#ccc" font-size="11">4</text>
  <text x="180" y="360" fill="#ccc" font-size="11">135.1</text>
  <text x="280" y="360" fill="#27ae60" font-size="11">110.3</text>
  <text x="390" y="360" fill="#e74c3c" font-size="11">52.6</text>
  <text x="500" y="360" fill="#e74c3c" font-size="11">9.8</text>
  <text x="610" y="360" fill="#e74c3c" font-size="11">7.7</text>
  
  <!-- 底部状态栏 -->
  <rect x="60" y="385" width="680" height="35" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="100" y="408" fill="#999" font-size="11">共 15 条数据 | 正常: 10条 | 故障: 5条</text>
  
  <!-- 下载按钮 -->
  <rect x="580" y="388" width="80" height="28" rx="4" fill="#27ae60"/>
  <text x="620" y="588" text-anchor="middle" fill="white" font-size="11">下载CSV</text>
  
  <rect x="670" y="388" width="70" height="28" rx="4" fill="#3498db"/>
  <text x="705" y="406" text-anchor="middle" fill="white" font-size="11">下载JSON</text>
</svg>