<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="700" height="320" fill="#121212" rx="8"/>
  <text x="350" y="40" text-anchor="middle" fill="#3498db" font-size="22" font-weight="bold">1. 基础按钮 (.btn)</text>
  <text x="350" y="62" text-anchor="middle" fill="#999" font-size="12">来源：所有页面 | padding: 12px 24px | border-radius: 4px | font-size: 16px</text>

  <!-- 默认状态 -->
  <text x="60" y="100" fill="#ccc" font-size="14" font-weight="bold">默认状态</text>
  <rect x="60" y="115" width="160" height="44" rx="4" fill="#3498db" filter="url(#shadow)"/>
  <text x="140" y="143" text-anchor="middle" fill="white" font-size="15">.btn 默认</text>
  <text x="260" y="143" fill="#666" font-size="12">background: #3498db</text>

  <!-- hover状态 -->
  <text x="60" y="190" fill="#ccc" font-size="14" font-weight="bold">悬停状态</text>
  <rect x="60" y="205" width="160" height="44" rx="4" fill="#2980b9" filter="url(#shadow)"/>
  <text x="140" y="233" text-anchor="middle" fill="white" font-size="15">.btn:hover</text>
  <text x="260" y="233" fill="#666" font-size="12">background: #2980b9</text>

  <!-- disabled状态 -->
  <text x="60" y="280" fill="#ccc" font-size="14" font-weight="bold">禁用状态</text>
  <rect x="60" y="260" width="160" height="44" rx="4" fill="#7f8c8d" filter="url(#shadow)"/>
  <text x="140" y="288" text-anchor="middle" fill="white" font-size="15">.btn:disabled</text>
  <line x1="62" y1="282" x2="218" y2="282" stroke="white" stroke-width="1" opacity="0.4"/>
  <text x="260" y="288" fill="#666" font-size="12">background: #7f8c8d, cursor: not-allowed</text>
</svg>
