<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- 背景 -->
  <rect width="1000" height="700" fill="#121212"/>
  
  <!-- 页面标题 -->
  <text x="500" y="35" text-anchor="middle" fill="#3498db" font-size="24" font-weight="bold">悬浮窗与主界面位置关系示意图</text>
  
  <!-- ==================== 主内容区域 ==================== -->
  <!-- 主容器边框 -->
  <rect x="200" y="80" width="600" height="520" rx="8" fill="#1e1e1e" stroke="#333" stroke-width="2"/>
  
  <!-- 主容器标题栏 -->
  <rect x="200" y="80" width="600" height="45" rx="8 8 0 0" fill="#2a2a2a"/>
  <text x="500" y="108" text-anchor="middle" fill="#3498db" font-size="16" font-weight="bold">时序数据生成 - 主界面</text>
  
  <!-- 主内容占位 -->
  <rect x="220" y="145" width="560" height="200" rx="4" fill="#252525"/>
  <text x="500" y="250" text-anchor="middle" fill="#666" font-size="14">主内容区域</text>
  
  <!-- 按钮区域 -->
  <rect x="220" y="360" width="150" height="40" rx="4" fill="#27ae60"/>
  <text x="295" y="385" text-anchor="middle" fill="white" font-size="13">开始生成</text>
  
  <rect x="385" y="360" width="100" height="40" rx="4" fill="#95a5a6"/>
  <text x="435" y="385" text-anchor="middle" fill="white" font-size="13">停止生成</text>
  
  <rect x="500" y="360" width="100" height="40" rx="4" fill="#95a5a6"/>
  <text x="550" y="385" text-anchor="middle" fill="white" font-size="13">清空结果</text>
  
  <!-- 状态显示 -->
  <rect x="220" y="420" width="560" height="160" rx="4" fill="#252525"/>
  <text x="260" y="455" fill="#999" font-size="12">轨道区段: </text>
  <text x="340" y="455" fill="#3498db" font-size="12">69G</text>
  <text x="260" y="480" fill="#999" font-size="12">故障类型: </text>
  <text x="340" y="480" fill="#3498db" font-size="12">无故障</text>
  <text x="260" y="505" fill="#999" font-size="12">仿真进度: </text>
  <text x="340" y="505" fill="#27ae60" font-size="12">8 / 15</text>
  
  <!-- ==================== 左侧菜单 ==================== -->
  <!-- 左侧菜单 (弹出状态) -->
  <rect x="50" y="80" width="150" height="520" rx="0" fill="#1e1e1e" stroke="#3498db" stroke-width="3"/>
  
  <!-- 左侧菜单标题栏 -->
  <rect x="50" y="80" width="150" height="45" fill="#1e1e1e"/>
  <text x="80" y="108" fill="#3498db" font-size="12" font-weight="bold">选择区段/故障</text>
  
  <!-- 关闭按钮 -->
  <text x="185" y="105" fill="#fff" font-size="18">×</text>
  
  <!-- 左侧菜单内容 -->
  <text x="70" y="150" fill="#ccc" font-size="11">轨道区段:</text>
  <rect x="65" y="160" width="120" height="25" rx="3" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="75" y="177" fill="#fff" font-size="9">请选择...</text>
  
  <text x="70" y="210" fill="#ccc" font-size="11">故障类型:</text>
  <rect x="65" y="220" width="120" height="25" rx="3" fill="#333" stroke="#3498db" stroke-width="1"/>
  <text x="75" y="237" fill="#fff" font-size="9">无故障</text>
  
  <rect x="65" y="270" width="120" height="30" rx="3" fill="#3498db"/>
  <text x="125" y="290" text-anchor="middle" fill="white" font-size="10">保存选择</text>
  
  <!-- 箭头标注 -->
  <line x1="195" y1="250" x2="195" y2="250" stroke="#3498db" stroke-width="2"/>
  <text x="195" y="245" text-anchor="middle" fill="#3498db" font-size="10">←</text>
  
  <!-- ==================== 右侧菜单 ==================== -->
  <!-- 右侧菜单 (弹出状态) -->
  <rect x="800" y="80" width="150" height="520" rx="0" fill="#1e1e1e" stroke="#3498db" stroke-width="3"/>
  
  <!-- 右侧菜单标题栏 -->
  <rect x="800" y="80" width="150" height="45" fill="#1e1e1e"/>
  <text x="830" y="108" fill="#3498db" font-size="12" font-weight="bold">参数设置</text>
  
  <!-- 关闭按钮 -->
  <text x="815" y="105" fill="#fff" font-size="18">×</text>
  
  <!-- 右侧菜单内容 -->
  <text x="815" y="145" fill="#ccc" font-size="9">轨道名称:</text>
  <rect x="810" y="152" width="130" height="20" rx="2" fill="#333" stroke="#3498db" stroke-width="1"/>
  
  <text x="815" y="190" fill="#ccc" font-size="9">轨道长度:</text>
  <rect x="810" y="197" width="130" height="20" rx="2" fill="#333" stroke="#3498db" stroke-width="1"/>
  
  <text x="815" y="235" fill="#ccc" font-size="9">电阻/电感/电容:</text>
  <rect x="810" y="242" width="130" height="20" rx="2" fill="#333" stroke="#3498db" stroke-width="1"/>
  
  <text x="815" y="280" fill="#ccc" font-size="9">衰耗盘端子:</text>
  <rect x="810" y="287" width="60" height="20" rx="2" fill="#333" stroke="#3498db" stroke-width="1"/>
  <rect x="880" y="287" width="60" height="20" rx="2" fill="#333" stroke="#3498db" stroke-width="1"/>
  
  <rect x="810" y="330" width="130" height="28" rx="3" fill="#3498db"/>
  <text x="875" y="348" text-anchor="middle" fill="white" font-size="10">保存参数</text>
  
  <!-- 箭头标注 -->
  <text x="805" y="250" text-anchor="middle" fill="#3498db" font-size="10">→</text>
  
  <!-- ==================== 底部窗口 ==================== -->
  <!-- 底部窗口 (弹出状态) -->
  <rect x="50" y="480" width="900" height="180" rx="8" fill="#1e1e1e" stroke="#3498db" stroke-width="3"/>
  
  <!-- 底部窗口标题栏 -->
  <rect x="50" y="480" width="900" height="40" rx="8 8 0 0" fill="#2a2a2a"/>
  <text x="80" y="505" fill="#3498db" font-size="14" font-weight="bold">仿真结果</text>
  
  <!-- 下载按钮 -->
  <rect x="700" y="487" width="80" height="26" rx="3" fill="#27ae60"/>
  <text x="740" y="504" text-anchor="middle" fill="white" font-size="10">CSV</text>
  <rect x="790" y="487" width="80" height="26" rx="3" fill="#3498db"/>
  <text x="830" y="504" text-anchor="middle" fill="white" font-size="10">JSON</text>
  
  <!-- 关闭按钮 -->
  <text x="930" y="502" fill="#fff" font-size="18">×</text>
  
  <!-- 结果卡片预览 -->
  <rect x="70" y="535" width="180" height="100" rx="4" fill="#2a2a2a"/>
  <rect x="70" y="535" width="4" height="100" rx="2" fill="#27ae60"/>
  <text x="85" y="560" fill="#3498db" font-size="10">#001 69G</text>
  <text x="85" y="580" fill="#ccc" font-size="9">电压: 128.5V</text>
  <text x="85" y="595" fill="#ccc" font-size="9">送端: 105.2V</text>
  <text x="85" y="610" fill="#ccc" font-size="9">受端: 98.3V</text>
  
  <rect x="260" y="535" width="180" height="100" rx="4" fill="#2a2a2a"/>
  <rect x="260" y="535" width="4" height="100" rx="2" fill="#27ae60"/>
  <text x="275" y="560" fill="#3498db" font-size="10">#002 69G</text>
  <text x="275" y="580" fill="#ccc" font-size="9">电压: 130.2V</text>
  <text x="275" y="595" fill="#ccc" font-size="9">送端: 106.8V</text>
  <text x="275" y="610" fill="#ccc" font-size="9">受端: 102.1V</text>
  
  <rect x="450" y="535" width="180" height="100" rx="4" fill="#2a2a2a"/>
  <rect x="450" y="535" width="4" height="100" rx="2" fill="#e74c3c"/>
  <text x="465" y="560" fill="#3498db" font-size="10">#003 69G 故障</text>
  <text x="465" y="580" fill="#ccc" font-size="9">电压: 128.5V</text>
  <text x="465" y="595" fill="#ccc" font-size="9">送端: 98.3V</text>
  <text x="465" y="610" fill="#e74c3c" font-size="9">受端: 45.2V ⚠</text>
  
  <rect x="640" y="535" width="180" height="100" rx="4" fill="#2a2a2a"/>
  <rect x="640" y="535" width="4" height="100" rx="2" fill="#27ae60"/>
  <text x="655" y="560" fill="#3498db" font-size="10">#004 69G</text>
  <text x="655" y="580" fill="#ccc" font-size="9">电压: 132.8V</text>
  <text x="655" y="595" fill="#ccc" font-size="9">送端: 108.5V</text>
  <text x="655" y="610" fill="#ccc" font-size="9">受端: 105.6V</text>
  
  <!-- 箭头标注 -->
  <text x="500" y="670" text-anchor="middle" fill="#3498db" font-size="14">↑</text>
  
  <!-- ==================== 图例说明 ==================== -->
  <rect x="50" y="665" width="15" height="15" rx="2" fill="#3498db"/>
  <text x="70" y="677" fill="#999" font-size="11">左侧选择菜单 (left-menu)</text>
  
  <rect x="300" y="665" width="15" height="15" rx="2" fill="#27ae60"/>
  <text x="320" y="677" fill="#999" font-size="11">右侧参数菜单 (right-menu)</text>
  
  <rect x="520" y="665" width="15" height="15" rx="2" fill="#e74c3c"/>
  <text x="540" y="677" fill="#999" font-size="11">底部结果窗口 (bottom-floating-window)</text>
  
  <!-- ==================== 侧边悬浮按钮 ==================== -->
  <!-- 左侧悬浮按钮 -->
  <rect x="10" y="250" width="35" height="120" rx="0 8 8 0" fill="#3498db"/>
  <text x="27" y="320" text-anchor="middle" fill="white" font-size="11" font-weight="bold">选择</text>
  <text x="27" y="335" text-anchor="middle" fill="white" font-size="11" font-weight="bold">区段</text>
  
  <!-- 右侧悬浮按钮 -->
  <rect x="955" y="250" width="35" height="120" rx="8 0 0 8" fill="#27ae60"/>
  <text x="972" y="320" text-anchor="middle" fill="white" font-size="11" font-weight="bold">参数</text>
  <text x="972" y="335" text-anchor="middle" fill="white" font-size="11" font-weight="bold">设置</text>
  
  <!-- 底部悬浮按钮 -->
  <rect x="400" y="660" width="200" height="35" rx="17" fill="#3498db"/>
  <text x="500" y="682" text-anchor="middle" fill="white" font-size="12">查看生成结果</text>
</svg>