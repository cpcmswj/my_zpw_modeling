<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1680" font-family="Arial, sans-serif">

  <!-- 背景 -->
  <rect width="1100" height="1680" fill="#121212"/>

  <!-- 标题 -->
  <text x="550" y="50" text-anchor="middle" fill="#3498db" font-size="28" font-weight="bold">铁路轨道电路故障模拟系统 - 按钮样式一览</text>
  <line x1="100" y1="70" x2="1000" y2="70" stroke="#3498db" stroke-width="2"/>

  <!-- ====== 第1组：基础按钮 (.btn) ====== -->
  <text x="60" y="110" fill="#ccc" font-size="18" font-weight="bold">1. 基础按钮 (.btn)</text>
  <text x="60" y="132" fill="#999" font-size="13">来源：所有页面 | background: #3498db, color: white, border-radius: 4px</text>

  <!-- .btn 默认 -->
  <rect x="60" y="150" width="160" height="44" rx="4" fill="#3498db"/>
  <text x="140" y="178" text-anchor="middle" fill="white" font-size="15">.btn 默认</text>

  <!-- .btn:hover -->
  <rect x="260" y="150" width="160" height="44" rx="4" fill="#2980b9"/>
  <text x="340" y="178" text-anchor="middle" fill="white" font-size="15">.btn:hover</text>

  <!-- .btn:disabled -->
  <rect x="460" y="150" width="160" height="44" rx="4" fill="#7f8c8d"/>
  <text x="540" y="178" text-anchor="middle" fill="white" font-size="15">.btn:disabled</text>
  <line x1="462" y1="172" x2="618" y2="172" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- ====== 第2组：按钮变体 ====== -->
  <text x="60" y="240" fill="#ccc" font-size="18" font-weight="bold">2. 按钮变体</text>
  <text x="60" y="262" fill="#999" font-size="13">来源：time_series_generator / voltage_evaluation / register</text>

  <!-- .btn.secondary -->
  <rect x="60" y="280" width="180" height="44" rx="4" fill="#95a5a6"/>
  <text x="150" y="308" text-anchor="middle" fill="white" font-size="15">.btn.secondary</text>

  <!-- .btn.secondary:hover -->
  <rect x="280" y="280" width="180" height="44" rx="4" fill="#7f8c8d"/>
  <text x="370" y="308" text-anchor="middle" fill="white" font-size="15">.secondary:hover</text>

  <!-- .btn.danger -->
  <rect x="500" y="280" width="180" height="44" rx="4" fill="#e74c3c"/>
  <text x="590" y="308" text-anchor="middle" fill="white" font-size="15">.btn.danger</text>

  <!-- .btn.danger:hover -->
  <rect x="720" y="280" width="180" height="44" rx="4" fill="#c0392b"/>
  <text x="810" y="308" text-anchor="middle" fill="white" font-size="15">.danger:hover</text>

  <!-- .btn-primary / .btn.success -->
  <rect x="60" y="350" width="180" height="44" rx="4" fill="#27ae60"/>
  <text x="150" y="378" text-anchor="middle" fill="white" font-size="15">.btn-primary</text>

  <!-- .btn-primary:hover -->
  <rect x="280" y="350" width="180" height="44" rx="4" fill="#219653"/>
  <text x="370" y="378" text-anchor="middle" fill="white" font-size="15">.btn-primary:hover</text>

  <!-- track_parameters .btn-secondary (绿色) -->
  <rect x="500" y="350" width="220" height="44" rx="4" fill="#27ae60"/>
  <text x="610" y="378" text-anchor="middle" fill="white" font-size="14">track_params .btn-secondary</text>

  <!-- track_parameters .btn-danger -->
  <rect x="760" y="350" width="200" height="44" rx="4" fill="#e74c3c"/>
  <text x="860" y="378" text-anchor="middle" fill="white" font-size="14">track_params .btn-danger</text>

  <!-- ====== 第3组：标签页按钮 (.tab-button) ====== -->
  <text x="60" y="440" fill="#ccc" font-size="18" font-weight="bold">3. 标签页按钮 (.tab-button)</text>
  <text x="60" y="462" fill="#999" font-size="13">来源：index / voltage_evaluation | border-bottom 切换效果</text>

  <!-- .tab-button 默认 -->
  <rect x="60" y="480" width="150" height="44" fill="#333" stroke="none"/>
  <text x="135" y="508" text-anchor="middle" fill="white" font-size="14">.tab-button</text>

  <!-- .tab-button:hover -->
  <rect x="230" y="480" width="150" height="44" fill="#3498db" stroke="none"/>
  <text x="305" y="508" text-anchor="middle" fill="white" font-size="14">:hover</text>

  <!-- .tab-button.active (index) -->
  <rect x="400" y="480" width="150" height="44" fill="#000" stroke="none"/>
  <rect x="400" y="520" width="150" height="4" fill="#3498db"/>
  <text x="475" y="508" text-anchor="middle" fill="#3498db" font-size="14">.active (index)</text>

  <!-- .tab-button.active (voltage_eval) -->
  <rect x="570" y="480" width="170" height="44" fill="#3498db" stroke="none"/>
  <text x="655" y="508" text-anchor="middle" fill="white" font-size="14">.active (voltage_eval)</text>

  <!-- ====== 第4组：图表控制按钮 (.chart-control-btn) ====== -->
  <text x="60" y="570" fill="#ccc" font-size="18" font-weight="bold">4. 图表控制按钮 (.chart-control-btn)</text>
  <text x="60" y="592" fill="#999" font-size="13">来源：time_series_generator | padding: 8px 16px, border-radius: 4px</text>

  <!-- 默认 -->
  <rect x="60" y="610" width="140" height="36" rx="4" fill="#3498db"/>
  <text x="130" y="634" text-anchor="middle" fill="white" font-size="13">.chart-control-btn</text>

  <!-- hover -->
  <rect x="220" y="610" width="100" height="36" rx="4" fill="#2980b9"/>
  <text x="270" y="634" text-anchor="middle" fill="white" font-size="13">:hover</text>

  <!-- active -->
  <rect x="340" y="610" width="100" height="36" rx="4" fill="#27ae60"/>
  <text x="390" y="634" text-anchor="middle" fill="white" font-size="13">.active</text>

  <!-- ====== 第5组：悬浮按钮 (.toggle-bottom-btn / .chart-toggle-btn) ====== -->
  <text x="60" y="690" fill="#ccc" font-size="18" font-weight="bold">5. 底部悬浮按钮</text>
  <text x="60" y="712" fill="#999" font-size="13">来源：time_series_generator | position: fixed, border-radius: 20px</text>

  <!-- .toggle-bottom-btn -->
  <rect x="60" y="730" width="200" height="44" rx="20" fill="#3498db"/>
  <text x="160" y="758" text-anchor="middle" fill="white" font-size="14">.toggle-bottom-btn</text>

  <!-- .toggle-bottom-btn:hover -->
  <rect x="290" y="730" width="200" height="44" rx="20" fill="#2980b9"/>
  <text x="390" y="758" text-anchor="middle" fill="white" font-size="14">:hover</text>

  <!-- .chart-toggle-btn -->
  <rect x="520" y="730" width="200" height="44" rx="20" fill="#27ae60"/>
  <text x="620" y="758" text-anchor="middle" fill="white" font-size="14">.chart-toggle-btn</text>

  <!-- .chart-toggle-btn:hover -->
  <rect x="750" y="730" width="200" height="44" rx="20" fill="#219653"/>
  <text x="850" y="758" text-anchor="middle" fill="white" font-size="14">:hover</text>

  <!-- ====== 第6组：侧边悬浮按钮 (.side-floating-btn) ====== -->
  <text x="60" y="820" fill="#ccc" font-size="18" font-weight="bold">6. 侧边悬浮按钮 (.side-floating-btn)</text>
  <text x="60" y="842" fill="#999" font-size="13">来源：time_series_generator / track_parameters | position: fixed, 竖向排列</text>

  <!-- .side-floating-btn-left -->
  <rect x="60" y="860" width="60" height="160" rx="0" fill="#3498db"/>
  <rect x="60" y="860" width="4" height="160" fill="#2196f3"/>
  <text x="90" y="920" text-anchor="middle" fill="white" font-size="12">轨道区段</text>

  <!-- .side-floating-btn-right -->
  <rect x="160" y="860" width="60" height="160" rx="0" fill="#27ae60"/>
  <rect x="216" y="860" width="4" height="160" fill="#2196f3"/>
  <text x="190" y="920" text-anchor="middle" fill="white" font-size="12">故障类型</text>

  <!-- track_parameters .side-floating-btn-left -->
  <rect x="260" y="860" width="60" height="160" rx="8" fill="#3498db"/>
  <rect x="260" y="860" width="4" height="160" fill="#2196f3"/>
  <text x="290" y="920" text-anchor="middle" fill="white" font-size="11">参数设置</text>

  <!-- track_parameters .side-floating-btn-right -->
  <rect x="360" y="860" width="60" height="160" rx="8" fill="#3498db"/>
  <rect x="416" y="860" width="4" height="160" fill="#2196f3"/>
  <text x="390" y="920" text-anchor="middle" fill="white" font-size="11">生成结果</text>

  <!-- ====== 第7组：关闭按钮 (.close-btn / .close-bottom-btn / .close-chart-btn) ====== -->
  <text x="60" y="1070" fill="#ccc" font-size="18" font-weight="bold">7. 关闭按钮</text>
  <text x="60" y="1092" fill="#999" font-size="13">来源：所有页面 | background: none, font-size: 24-28px, color变化</text>

  <!-- .close-btn 默认 -->
  <rect x="60" y="1110" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="85" y="1145" text-anchor="middle" fill="#3498db" font-size="28">×</text>
  <text x="130" y="1142" fill="#999" font-size="12">.close-btn</text>

  <!-- .close-btn:hover -->
  <rect x="220" y="1110" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="245" y="1145" text-anchor="middle" fill="#e74c3c" font-size="28">×</text>
  <text x="290" y="1142" fill="#999" font-size="12">:hover → 红色</text>

  <!-- .close-bottom-btn -->
  <rect x="420" y="1110" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="445" y="1145" text-anchor="middle" fill="#fff" font-size="28">×</text>
  <text x="490" y="1142" fill="#999" font-size="12">.close-bottom-btn</text>

  <!-- .close-chart-btn -->
  <rect x="640" y="1110" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="665" y="1145" text-anchor="middle" fill="#fff" font-size="28">×</text>
  <text x="710" y="1142" fill="#999" font-size="12">.close-chart-btn</text>

  <!-- ====== 第8组：登录按钮 (.login-form button) ====== -->
  <text x="60" y="1210" fill="#ccc" font-size="18" font-weight="bold">8. 登录按钮 (.login-form button)</text>
  <text x="60" y="1232" fill="#999" font-size="13">来源：index / time_series_generator / track_parameters | width: 300px, padding: 10px</text>

  <!-- .login-form button -->
  <rect x="60" y="1250" width="300" height="44" rx="4" fill="#3498db"/>
  <text x="210" y="1278" text-anchor="middle" fill="white" font-size="16">登录</text>

  <!-- .login-form button:hover -->
  <rect x="400" y="1250" width="300" height="44" rx="4" fill="#2980b9"/>
  <text x="550" y="1278" text-anchor="middle" fill="white" font-size="16">登录 :hover</text>

  <!-- ====== 第9组：注册页面按钮 ====== -->
  <text x="60" y="1340" fill="#ccc" font-size="18" font-weight="bold">9. 注册页面按钮 (register.html)</text>
  <text x="60" y="1362" fill="#999" font-size="13">来源：register.html | width: 100%</text>

  <!-- .btn-primary (register) -->
  <rect x="60" y="1380" width="250" height="44" rx="4" fill="#27ae60"/>
  <text x="185" y="1408" text-anchor="middle" fill="white" font-size="15">.btn-primary 注册</text>

  <!-- .btn-primary:hover -->
  <rect x="340" y="1380" width="250" height="44" rx="4" fill="#219653"/>
  <text x="465" y="1408" text-anchor="middle" fill="white" font-size="15">.btn-primary:hover</text>

  <!-- .btn-secondary (register) -->
  <rect x="620" y="1380" width="250" height="44" rx="4" fill="#3498db"/>
  <text x="745" y="1408" text-anchor="middle" fill="white" font-size="15">.btn-secondary 返回</text>

  <!-- .btn-secondary:hover (register) -->
  <rect x="900" y="1380" width="160" height="44" rx="4" fill="#2980b9"/>
  <text x="980" y="1408" text-anchor="middle" fill="white" font-size="14">:hover</text>

  <!-- ====== 颜色图例 ====== -->
  <text x="60" y="1480" fill="#ccc" font-size="18" font-weight="bold">颜色图例</text>

  <rect x="60" y="1500" width="30" height="20" rx="2" fill="#3498db"/>
  <text x="100" y="1516" fill="#ccc" font-size="13">#3498db 主色（蓝）</text>

  <rect x="260" y="1500" width="30" height="20" rx="2" fill="#2980b9"/>
  <text x="300" y="1516" fill="#ccc" font-size="13">#2980b9 主色悬停</text>

  <rect x="460" y="1500" width="30" height="20" rx="2" fill="#27ae60"/>
  <text x="500" y="1516" fill="#ccc" font-size="13">#27ae60 成功（绿）</text>

  <rect x="660" y="1500" width="30" height="20" rx="2" fill="#e74c3c"/>
  <text x="700" y="1516" fill="#ccc" font-size="13">#e74c3c 危险（红）</text>

  <rect x="860" y="1500" width="30" height="20" rx="2" fill="#95a5a6"/>
  <text x="900" y="1516" fill="#ccc" font-size="13">#95a5a6 次要（灰）</text>

  <rect x="60" y="1530" width="30" height="20" rx="2" fill="#7f8c8d"/>
  <text x="100" y="1546" fill="#ccc" font-size="13">#7f8c8d 禁用（深灰）</text>

  <rect x="260" y="1530" width="30" height="20" rx="2" fill="#219653"/>
  <text x="300" y="1546" fill="#ccc" font-size="13">#219653 成功悬停</text>

  <rect x="460" y="1530" width="30" height="20" rx="2" fill="#c0392b"/>
  <text x="500" y="1546" fill="#ccc" font-size="13">#c0392b 危险悬停</text>

  <rect x="660" y="1530" width="30" height="20" rx="2" fill="#333"/>
  <text x="700" y="1546" fill="#ccc" font-size="13">#333 标签页默认</text>

  <rect x="860" y="1530" width="30" height="20" rx="2" fill="#000"/>
  <text x="900" y="1546" fill="#ccc" font-size="13">#000 标签页激活(index)</text>

  <!-- 底部说明 -->
  <line x1="100" y1="1590" x2="1000" y2="1590" stroke="#3498db" stroke-width="1" opacity="0.5"/>
  <text x="550" y="1620" text-anchor="middle" fill="#666" font-size="13">本图展示了项目中所有CSS按钮样式及其默认/hover/active/disabled状态</text>
  <text x="550" y="1645" text-anchor="middle" fill="#666" font-size="13">涉及页面：index.html | time_series_generator.html | track_parameters.html | voltage_evaluation.html | register.html</text>
  <text x="550" y="1670" text-anchor="middle" fill="#444" font-size="11">Generated from project CSS analysis</text>
</svg>
