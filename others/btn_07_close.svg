<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#121212" rx="8"/>
  <text x="400" y="40" text-anchor="middle" fill="#3498db" font-size="22" font-weight="bold">7. 关闭按钮</text>
  <text x="400" y="62" text-anchor="middle" fill="#999" font-size="12">来源：所有页面 | background: none/transparent | font-size: 24-28px | 颜色变化</text>

  <!-- .close-btn (模态框) -->
  <text x="60" y="100" fill="#ccc" font-size="14" font-weight="bold">.close-btn 模态框关闭</text>
  <rect x="60" y="115" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="85" y="150" text-anchor="middle" fill="#3498db" font-size="28">×</text>
  <text x="130" y="145" fill="#666" font-size="12">color: #3498db (蓝色)</text>

  <rect x="330" y="115" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="355" y="150" text-anchor="middle" fill="#e74c3c" font-size="28">×</text>
  <text x="400" y="145" fill="#666" font-size="12">:hover → color: #e74c3c (红色)</text>

  <!-- .close-bottom-btn (底部窗口) -->
  <text x="60" y="200" fill="#ccc" font-size="14" font-weight="bold">.close-bottom-btn 底部窗口关闭</text>
  <rect x="60" y="215" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="85" y="250" text-anchor="middle" fill="#fff" font-size="28">×</text>
  <text x="130" y="245" fill="#666" font-size="12">color: #fff (白色)</text>

  <rect x="330" y="215" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="355" y="250" text-anchor="middle" fill="#e74c3c" font-size="28">×</text>
  <text x="400" y="245" fill="#666" font-size="12">:hover → color: #e74c3c (红色)</text>

  <!-- .close-chart-btn (图表窗口) -->
  <text x="60" y="300" fill="#ccc" font-size="14" font-weight="bold">.close-chart-btn 图表窗口关闭</text>
  <rect x="60" y="315" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="85" y="350" text-anchor="middle" fill="#fff" font-size="28">×</text>
  <text x="130" y="345" fill="#666" font-size="12">color: #fff (白色)</text>

  <rect x="330" y="315" width="50" height="50" rx="4" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="355" y="350" text-anchor="middle" fill="#e74c3c" font-size="28">×</text>
  <text x="400" y="345" fill="#666" font-size="12">:hover → color: #e74c3c (红色)</text>

  <!-- 说明 -->
  <rect x="560" y="115" width="200" height="250" rx="6" fill="#1e1e1e" stroke="#3498db" stroke-width="1"/>
  <text x="660" y="145" text-anchor="middle" fill="#ccc" font-size="13" font-weight="bold">共同特征</text>
  <text x="660" y="170" text-anchor="middle" fill="#999" font-size="11">background: none</text>
  <text x="660" y="190" text-anchor="middle" fill="#999" font-size="11">border: none</text>
  <text x="660" y="210" text-anchor="middle" fill="#999" font-size="11">font-size: 24-28px</text>
  <text x="660" y="230" text-anchor="middle" fill="#999" font-size="11">font-weight: bold</text>
  <text x="660" y="250" text-anchor="middle" fill="#999" font-size="11">cursor: pointer</text>
  <text x="660" y="280" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">hover统一变红</text>
  <text x="660" y="300" text-anchor="middle" fill="#999" font-size="11">color → #e74c3c</text>
</svg>
